name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 格式 / Clippy / 测试 / Release 构建
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fxshot-ci

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 运行单元测试
        run: cargo test --all-targets --locked

      - name: 构建 Release 可执行文件
        run: cargo build --release --locked

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: fxshot-windows-x64-ci
          path: |
            target/release/fxshot.exe
            config.example.toml
            README.md
          if-no-files-found: error
          retention-days: 7
